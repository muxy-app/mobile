name: Android Checks

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-checks.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-checks.yml"

concurrency:
  group: android-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Muxy SDK
        run: android/scripts/sdk.sh install

      - name: Run checks
        run: android/scripts/checks.sh

      - name: Run unit tests
        run: android/scripts/run.sh test

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
