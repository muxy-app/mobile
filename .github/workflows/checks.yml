name: iOS Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
  push:
    branches: [main]
    paths:
      - "ios/**"

concurrency:
  group: ios-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run iOS unit tests
        run: ios/scripts/run.sh test
