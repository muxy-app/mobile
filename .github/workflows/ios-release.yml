name: Release iOS (React Native)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (format: X.Y.Z)"
        required: true
        type: string
      build_number:
        description: "Build number (defaults to a Unix timestamp)"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: false
        type: string
      skip_release_tag:
        description: "Skip the GitHub Release step (caller will create the tag)"
        required: false
        type: boolean
        default: false
    secrets:
      APP_STORE_CONNECT_API_KEY:
        required: true
      APP_STORE_CONNECT_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APPLE_TEAM_ID:
        required: true
      APPLE_DISTRIBUTION_CERTIFICATE:
        required: false
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APP_STORE_PROVISIONING_PROFILE:
        required: false

jobs:
  release-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APP_SCHEME: Muxy
      APP_WORKSPACE: ios/Muxy.xcworkspace
      APP_ARCHIVE_PATH: build/Muxy.xcarchive
      APP_EXPORT_PATH: build/export
    outputs:
      version: ${{ steps.validate.outputs.version }}
      build_number: ${{ steps.validate.outputs.build_number }}
      artifact_name: ${{ steps.validate.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Validate inputs
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          VERSION="$INPUT_VERSION"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: version must be X.Y.Z"
            exit 1
          fi

          if [[ -n "$INPUT_BUILD_NUMBER" ]]; then
            BUILD_NUMBER="$INPUT_BUILD_NUMBER"
          else
            BUILD_NUMBER=$(date +%s)
          fi

          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Error: build_number must be numeric"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "artifact_name=ios-release-$VERSION-$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version in app.json
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          BUILD_NUMBER: ${{ steps.validate.outputs.build_number }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "app.json";
            const cfg = JSON.parse(fs.readFileSync(path, "utf8"));
            cfg.expo.version = process.env.VERSION;
            cfg.expo.ios = cfg.expo.ios || {};
            cfg.expo.ios.buildNumber = process.env.BUILD_NUMBER;
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        run: npx pod-install@1.1.0 ios --non-interactive

      - name: Install App Store Connect API key
        id: api_key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          umask 077
          KEY_DIRECTORY="$RUNNER_TEMP/private_keys"
          KEY_PATH="$KEY_DIRECTORY/AuthKey_${KEY_ID}.p8"
          mkdir -p "$KEY_DIRECTORY" "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$API_KEY" > "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_PATH: ${{ steps.api_key.outputs.path }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -workspace "$APP_WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$APP_ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            clean archive

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_PATH: ${{ steps.api_key.outputs.path }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$APP_ARCHIVE_PATH" \
            -exportPath "$APP_EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_FILES=("$APP_EXPORT_PATH"/*.ipa)
          if [[ ! -e "${IPA_FILES[0]}" ]]; then
            echo "Error: IPA not found in $APP_EXPORT_PATH"
            exit 1
          fi

          xcrun altool \
            --upload-app \
            --type ios \
            --file "${IPA_FILES[0]}" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.validate.outputs.artifact_name }}
          path: |
            build/Muxy.xcarchive
            build/export/*.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ !inputs.skip_release_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          PREV_TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName \
            -q '[.[] | select(.tagName | startswith("ios-v"))][0].tagName')

          if [[ -n "$PREV_TAG" ]]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          git log --no-merges --format='- %s' "$RANGE" > notes.md

          if [[ ! -s notes.md ]]; then
            echo "- No changes since ${PREV_TAG:-initial release}" > notes.md
          fi

          gh release create "ios-v$VERSION" \
            --repo "${{ github.repository }}" \
            --title "iOS v$VERSION" \
            --notes-file notes.md \
            --latest=false \
            --target "${{ github.sha }}"
