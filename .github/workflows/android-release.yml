name: Release Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (X.Y.Z)"
        required: true
        type: string
      version_code:
        description: "Version code (defaults to a Unix timestamp)"
        required: false
        type: string
      track:
        description: "Play track (auto: production for 1.x or later, otherwise alpha)"
        required: false
        type: choice
        default: auto
        options: [auto, internal, alpha, production]
      skip_release_tag:
        description: "Skip the GitHub Release step"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version_name:
        required: true
        type: string
      version_code:
        required: false
        type: string
      track:
        required: false
        type: string
        default: auto
      skip_release_tag:
        description: "Skip the GitHub Release step (caller will create the tag)"
        required: false
        type: boolean
        default: false
    outputs:
      sdk_version:
        description: "Muxy SDK release the app was built with"
        value: ${{ jobs.build-android.outputs.sdk_version }}
    secrets:
      ANDROID_SIGNING_KEY_BASE64:
        required: true
      ANDROID_KEY_STORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false

defaults:
  run:
    shell: bash

concurrency:
  group: android-play-release
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.validate.outputs.version_name }}
      version_code: ${{ steps.validate.outputs.version_code }}
      track: ${{ steps.validate.outputs.track }}
      artifact_name: ${{ steps.validate.outputs.artifact_name }}
      sdk_version: ${{ steps.sdk.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate inputs
        id: validate
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          TRACK: ${{ inputs.track }}
        run: |
          source android/scripts/release-inputs.sh
          validate_release_inputs
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "track=$TRACK"
            echo "artifact_name=android-release-$VERSION_NAME-$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Muxy SDK
        id: sdk
        run: |
          android/scripts/sdk.sh install
          echo "version=$(cat android/MuxyMobileSDK/Installed/REVISION)" >> "$GITHUB_OUTPUT"

      - name: Install NDK
        run: android/scripts/install-ndk.sh

      - name: Decode signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed Release AAB
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.validate.outputs.version_name }}
          VERSION_CODE: ${{ steps.validate.outputs.version_code }}
          ANDROID_SIGNING_KEY_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Check release artifacts
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          test -s android/app/build/outputs/mapping/release/mapping.txt
          test -s android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.validate.outputs.artifact_name }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error

  play-upload:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check Play upload secret
        id: play_secret
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -n "$PLAY_JSON" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "PLAY_SERVICE_ACCOUNT_JSON not set; skipping Play upload."
          fi

      - name: Download release artifacts
        if: steps.play_secret.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-android.outputs.artifact_name }}
          path: release

      - name: Upload to Play Store
        if: steps.play_secret.outputs.present == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.muxy.app
          releaseFiles: release/bundle/release/app-release.aab
          mappingFile: release/mapping/release/mapping.txt
          debugSymbols: release/native-debug-symbols/release/native-debug-symbols.zip
          track: ${{ needs.build-android.outputs.track }}
          status: draft
          changesNotSentForReview: ${{ needs.build-android.outputs.track == 'production' }}

  release-tag:
    needs: [build-android, play-upload]
    if: ${{ !inputs.skip_release_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          VERSION_NAME: ${{ needs.build-android.outputs.version_name }}
          SDK_VERSION: ${{ needs.build-android.outputs.sdk_version }}
        run: |
          PREV_TAG=$(gh release list \
            --repo "$REPOSITORY" \
            --limit 100 \
            --json tagName \
            -q '[.[] | select(.tagName | startswith("android-v"))][0].tagName')

          RANGE="HEAD"
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="$PREV_TAG..HEAD"
          fi

          git log --no-merges --format='- %s' "$RANGE" -- android > notes.md
          if [[ ! -s notes.md ]]; then
            echo "- No Android changes since ${PREV_TAG:-initial release}" > notes.md
          fi
          printf '\nBuilt with Muxy SDK %s.\n' "$SDK_VERSION" >> notes.md

          gh release create "android-v$VERSION_NAME" \
            --repo "$REPOSITORY" \
            --title "Android v$VERSION_NAME" \
            --notes-file notes.md \
            --latest=false \
            --target "$TARGET_SHA"
