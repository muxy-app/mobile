name: iOS Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-checks.yml"
      - ".github/workflows/ios-release.yml"
      - "scripts/release-ios.sh"
      - "scripts/tests/test_ios_toolchain.py"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-checks.yml"
      - ".github/workflows/ios-release.yml"
      - "scripts/release-ios.sh"
      - "scripts/tests/test_ios_toolchain.py"

concurrency:
  group: ios-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test iOS toolchain requirements
        run: python3 -m unittest discover -s scripts/tests -p 'test_ios_toolchain.py'

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

      - name: Run iOS checks
        run: ios/scripts/checks.sh
